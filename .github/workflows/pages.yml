name: Deploy CardUI to GitHub Pages

on:
  push:
    branches: ["master", "main"]
    paths:
      - "index.html"
      - "login.html"
      - "signup.html"
      - "profile.html"
      - "index.css"
      - "index.js"
      - "assets/**"
      - "css/**"
      - "js/**"
      - "firebase-applet-config.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static frontend files
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html login.html signup.html profile.html index.css index.js _site/
          if [ -f firebase-applet-config.json ]; then cp firebase-applet-config.json _site/; fi
          cp -r assets css js _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: "_site"
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
